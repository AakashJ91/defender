<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="revenantMist" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iceSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="30%" stop-color="#bae6fd"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="frostBlade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="revenantGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.7"/>
    </filter>
  </defs>

  <g filter="url(#revenantGlow)">
    <!-- Floating Spectral Fog Aura -->
    <circle cx="56" cy="64" r="32" fill="url(#revenantMist)"/>

    <!-- Tattered Ghostly Ice Cloak (Streaming Left) -->
    <path d="M52,48 Q28,40 10,46 Q24,54 14,64 Q26,68 8,76 Q30,78 52,80 Z" fill="#0369a1" opacity="0.85"/>
    <path d="M48,52 Q26,46 14,52 Q28,58 18,66 Q30,70 12,80 Q32,80 48,76 Z" fill="#0284c7" opacity="0.9"/>
    <path d="M44,56 Q28,54 20,60 Q32,64 24,70 Q36,72 44,72 Z" fill="#38bdf8" opacity="0.95"/>

    <!-- Floating Spectral Frostblade (Levitating forward on top flank) -->
    <g transform="rotate(10 90 28)">
      <!-- Blade -->
      <polygon points="68,26 116,24 122,27 116,30 68,28" fill="url(#frostBlade)" stroke="#0284c7" stroke-width="1"/>
      <line x1="72" y1="27" x2="114" y2="27" stroke="#ffffff" stroke-width="1.5"/>
      <!-- Crossguard -->
      <rect x="66" y="20" width="4" height="14" rx="1.5" fill="url(#iceSteel)"/>
      <circle cx="68" cy="27" r="2.5" fill="#38bdf8"/>
      <!-- Hilt & Pommel -->
      <rect x="56" y="25.5" width="10" height="3" fill="#0c4a6e"/>
      <polygon points="56,24 52,27 56,30" fill="url(#iceSteel)"/>
    </g>

    <!-- Armored Skeletal / Spectral Torso -->
    <ellipse cx="56" cy="64" rx="20" ry="18" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
    <!-- Glacial Breastplate -->
    <path d="M42,54 L68,50 L72,64 L68,78 L42,74 Z" fill="url(#iceSteel)" stroke="#0369a1" stroke-width="1.5"/>
    <line x1="42" y1="64" x2="70" y2="64" stroke="#0284c7" stroke-width="2"/>

    <!-- Spiked Glacial Pauldrons -->
    <polygon points="46,38 64,30 70,44 54,48" fill="url(#iceSteel)" stroke="#0369a1" stroke-width="1.5"/>
    <polygon points="62,28 72,16 68,32" fill="#e0f2fe"/>
    <polygon points="46,90 64,98 70,84 54,80" fill="url(#iceSteel)" stroke="#0369a1" stroke-width="1.5"/>
    <polygon points="62,100 72,112 68,96" fill="#e0f2fe"/>

    <!-- Armored Glacial Helm (Facing Right) -->
    <path d="M64,50 L86,46 L96,64 L86,82 L64,78 Z" fill="url(#iceSteel)" stroke="#082f49" stroke-width="2"/>
    <!-- Horns of Ice on Helm -->
    <path d="M72,46 Q70,28 58,22 Q72,36 78,44 Z" fill="url(#iceSteel)" stroke="#0284c7" stroke-width="1.2"/>
    <path d="M72,82 Q70,100 58,106 Q72,92 78,84 Z" fill="url(#iceSteel)" stroke="#0284c7" stroke-width="1.2"/>

    <!-- Shadowed Visor Slit -->
    <polygon points="80,56 94,58 96,64 94,70 80,72 84,64" fill="#020617"/>

    <!-- Blazing Soul Eyes in Visor -->
    <ellipse cx="88" cy="60" rx="3.5" ry="2" fill="#38bdf8"/>
    <ellipse cx="88" cy="68" rx="3.5" ry="2" fill="#38bdf8"/>
    <circle cx="89" cy="60" r="1.2" fill="#ffffff"/>
    <circle cx="89" cy="68" r="1.2" fill="#ffffff"/>
  </g>
</svg>
